name: iso_build
on:
  workflow_dispatch:
#  schedule:
#    - cron:  '30 2 * * 1'
#    - cron:  '22 21 * * *'
permissions:
  contents: write
  actions: read

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      - id: time
        uses: nanzm/get-time-action@v1.1
        with:
          format: 'YYYYMMDDHHmm'
    outputs:
      release_tag: ${{ steps.time.outputs.time }}

  build-release:
    runs-on: ubuntu-24.04
    needs: [prepare-release]
    timeout-minutes: 120 # Ezt is megtartottam, hasznos biztonsági öv
    strategy:
      matrix:
        EDITION: [awesome]
        BRANCH: [stable]
        SCOPE: [full]
    steps:
      - uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      
      - id: time
        uses: nanzm/get-time-action@v1.1
        with:
          format: 'YY.MM'   

      # Ez a lépés építi az ISO-t
      - name: image-build-upload
        uses: manjaro/manjaro-iso-action@main
        with:
          iso-profiles-repo: 'https://github.com/megvadulthangya/iso-profiles'
          iso-profiles-branch: 'testing'
          build-mirror: https://mirror.netcologne.de/manjaro/
          edition: ${{ matrix.edition }}
          branch: ${{ matrix.branch }}
          scope: ${{ matrix.scope }}
          version: ${{ steps.time.outputs.time }}-Nordic-TESTING
          kernel: linux612
          code-name: "awesome-Build"
          # KIKOMMENTELVE: Így nem tölti fel GitHub Release-be és nem darabol!
          # release-tag: ${{ needs.prepare-release.outputs.release_tag }}

      # --- SOURCEFORGE FELTÖLTÉS ---
      - name: Upload FULL ISO + CHECKSUMS to SourceForge
        if: success()
        env:
          SF_USER: ${{ secrets.SF_USERNAME }}
          SF_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_PROJECT: "manjaro-awesome-iso"
          SF_DIR: "Releases/${{ needs.prepare-release.outputs.release_tag }}"
        run: |
          # 1. SSH beállítás
          mkdir -p ~/.ssh
          echo "$SF_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Hozzáadjuk a szervereket a kivételekhez
          ssh-keyscan -H frs.sourceforge.net shell.sourceforge.net >> ~/.ssh/known_hosts

          # 2. ISO megkeresése
          ISO_FILE=$(find . -type f -name "*.iso" | head -n 1)
          SOURCE_DIR=$(dirname "$ISO_FILE")

          if [ -z "$ISO_FILE" ]; then
            echo "HIBA: Nem található ISO fájl!"
            exit 1
          fi

          echo "Forrás mappa: $SOURCE_DIR"
          echo "Cél: /home/frs/project/$SF_PROJECT/$SF_DIR/"

          # 3. Rendszer ébresztése (create)
          echo "SourceForge tárhely inicializálása..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $SF_USER@shell.sourceforge.net "create" || true
          
          # 4. Mappa létrehozása SFTP-vel
          echo "Mappaszerkezet létrehozása SFTP-vel..."
          echo -e "mkdir /home/frs/project/$SF_PROJECT/Releases\n mkdir /home/frs/project/$SF_PROJECT/$SF_DIR" > sftp_commands.txt
          
          sftp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 -b sftp_commands.txt $SF_USER@frs.sourceforge.net || true
          
          # 5. Feltöltés
          echo "Feltöltés indítása..."
          rsync -avP -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519" "$SOURCE_DIR"/*.iso "$SOURCE_DIR"/*.sha* "$SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/$SF_DIR/"
      
      # KIKOMMENTELVE: Mivel nincs GitHub Release, nincs mit visszavonni sem
      # - name: rollback
      #   if: ${{ failure() || cancelled() }}
      #   run: |
      #     echo ${{ github.token }} | gh auth login --with-token
      #     gh release delete ${{ needs.prepare-release.outputs.release_tag }} -y --repo ${{ github.repository }}
