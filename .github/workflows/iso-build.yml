name: iso_build
on:
  workflow_dispatch:
#  schedule:
#    - cron:  '30 2 * * 1'
#    - cron:  '22 21 * * *'
permissions:
  contents: write
  actions: read

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      - id: time
        uses: nanzm/get-time-action@v1.1
        with:
          format: 'YYYYMMDDHHmm'
    outputs:
      release_tag: ${{ steps.time.outputs.time }}

  build-release:
    runs-on: ubuntu-24.04
    needs: [prepare-release]
    strategy:
      matrix:
        EDITION: [awesome]
        BRANCH: [stable]
        SCOPE: [full]
    steps:
      - uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      
      - id: time
        uses: nanzm/get-time-action@v1.1
        with:
          format: 'YY.MM'   

      # Ez a lépés építi az ISO-t és tölti fel GitHubra (darabolva)
      - name: image-build-upload
        uses: manjaro/manjaro-iso-action@main
        with:
          iso-profiles-repo: 'https://github.com/megvadulthangya/iso-profiles'
          iso-profiles-branch: 'testing'
          build-mirror: https://mirror.netcologne.de/manjaro/
          edition: ${{ matrix.edition }}
          branch: ${{ matrix.branch }}
          scope: ${{ matrix.scope }}
          version: ${{ steps.time.outputs.time }}-Nordic-TESTING
          kernel: linux612
          code-name: "awesome-Build"
          release-tag: ${{ needs.prepare-release.outputs.release_tag }}

      # --- ÚJ RÉSZ: SOURCEFORGE FELTÖLTÉS ---
      - name: Upload FULL ISO + CHECKSUMS to SourceForge
        if: success()
        env:
          SF_USER: ${{ secrets.SF_USERNAME }}
          SF_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_PROJECT: "manjaro-awesome-iso"
          SF_DIR: "Releases/${{ needs.prepare-release.outputs.release_tag }}"
        run: |
          # 1. SSH beállítás
          mkdir -p ~/.ssh
          echo "$SF_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Hozzáadjuk a szervereket a kivételekhez
          ssh-keyscan -H frs.sourceforge.net shell.sourceforge.net >> ~/.ssh/known_hosts

          # 2. ISO megkeresése (hogy tudjuk, melyik mappában vagyunk)
          ISO_FILE=$(find . -type f -name "*.iso" | head -n 1)

          if [ -z "$ISO_FILE" ]; then
            echo "HIBA: Nem található ISO fájl!"
            exit 1
          fi

          # Megkeressük a fájl mappáját (általában . vagy ./build)
          SOURCE_DIR=$(dirname "$ISO_FILE")

          echo "Forrás mappa: $SOURCE_DIR"
          echo "Cél: /home/frs/project/$SF_PROJECT/$SF_DIR/"

          # 3. Mappa létrehozása a szerveren
          echo "Mappaszerkezet létrehozása..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $SF_USER@shell.sourceforge.net "mkdir -p /home/frs/project/$SF_PROJECT/$SF_DIR"
          
          # 4. Feltöltés (ISO + SHA fájlok)
          echo "Feltöltés indítása..."
          # A "$SOURCE_DIR"/*.iso jelöli az iso-t
          # A "$SOURCE_DIR"/*.sha* jelöli az összes hash fájlt (.sha1, .sha256, .sha512)
          rsync -avP -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519" "$SOURCE_DIR"/*.iso "$SOURCE_DIR"/*.sha* "$SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/$SF_DIR/"
      # --- VÉGE AZ ÚJ RÉSZNEK ---

      - name: rollback
        if: ${{ failure() || cancelled() }}
        run: |
          echo ${{ github.token }} | gh auth login --with-token
          gh release delete ${{ needs.prepare-release.outputs.release_tag }} -y --repo ${{ github.repository }}
